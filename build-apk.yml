name: Build Android APK

# Builds an installable debug APK of FrameLocal on every push to main/master.
# You can also run it by hand: Actions tab -> "Build Android APK" -> Run workflow.
on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

jobs:
  apk:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Check out the code
        uses: actions/checkout@v4

      - name: Set up Node 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
          cache: gradle

      - name: Set up the Android SDK
        uses: android-actions/setup-android@v3

      - name: Install dependencies
        run: npm ci

      - name: Add the Android project (first run only)
        run: |
          if [ ! -d android ]; then
            npx cap add android
          fi

      - name: Generate launcher icons and splash screens
        run: npm run icons

      - name: Allow the camera
        run: node scripts/patch-android.mjs

      - name: Copy the web app into Android
        run: npx cap sync android

      - name: Build the debug APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon

      - name: Upload the APK
        uses: actions/upload-artifact@v4
        with:
          name: FrameLocal-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
